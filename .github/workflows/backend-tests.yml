name: Backend tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend-dependency-audit:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: python -m pip install pip-audit

      - name: Audit backend dependencies
        run: pip-audit -r requirements.txt


  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: lamba_db
          POSTGRES_USER: lamba_user
          POSTGRES_PASSWORD: change_me
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lamba_user -d lamba_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      PYTHONPATH: .
      POSTGRES_DB: lamba_db
      POSTGRES_USER: lamba_user
      POSTGRES_PASSWORD: change_me
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      DATABASE_URL: postgresql+asyncpg://lamba_user:change_me@127.0.0.1:5432/lamba_db
      BACKEND_BASE_URL: http://127.0.0.1:8000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx

      - name: Run database migrations
        run: alembic upgrade head

      - name: Start backend
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:8000/docs && exit 0
            sleep 1
          done
          cat uvicorn.log
          exit 1

      - name: Run backend tests
        run: pytest tests --cov=app --cov-report=term-missing
