name: Backend tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend-response-time:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: lamba_db
          POSTGRES_USER: lamba_user
          POSTGRES_PASSWORD: lamba_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lamba_user -d lamba_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql+asyncpg://lamba_user:lamba_password@127.0.0.1:5432/lamba_db
      BACKEND_BASE_URL: http://127.0.0.1:8000
      API_PREFIX: /api/v1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Run database migrations
        run: alembic upgrade head

      - name: Start backend
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          sleep 5

      - name: Run backend tests
        run: pytest tests/test_registration_response_time.py tests/test_assistant_service.py
